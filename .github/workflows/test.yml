name: SQLite and PostgreSQL verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: umbra_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: umbra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U umbra_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[api,dev]"
      - run: ruff check src tests
      - run: pytest -q
        env:
          UMBRA_TEST_POSTGRES_URL: postgresql+asyncpg://umbra_test:ci-test-only@127.0.0.1:5432/umbra_test
