[project]
name = "umbra-intel"
version = "0.4.1"
description = "Umbra — dark-web crawling and intelligence platform (core engine)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx[socks]>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "selectolax>=0.3.21",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "cryptography>=46",
    "pyotp>=2.9",
]

[project.optional-dependencies]
# LLM enrichment is optional — the core crawls without it.
llm = ["anthropic>=0.69"]
# The query/alerting API service.
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# Real (semantic) offline embeddings — swaps the default hashing embedder.
embeddings = ["fastembed>=0.3"]
dev = [
    "psutil>=6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
umbra = "umbra.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umbra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
